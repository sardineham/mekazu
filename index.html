<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>目数計算ツール</title>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white shadow-xl rounded-2xl p-6 w-full max-w-2xl space-y-6">

        <h1 class="text-2xl font-bold text-gray-700">目数計算ツール</h1>

        <!-- 入力 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <label class="flex flex-col text-sm text-gray-600">
                大きい目数
                <input type="number" id="num1"
                    class="mt-1 border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-400 outline-none">
            </label>

            <label class="flex flex-col text-sm text-gray-600">
                小さい目数
                <input type="number" id="num2"
                    class="mt-1 border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-400 outline-none">
            </label>
        </div>

        <!-- ボタン -->
        <button onclick="calc()" type="button"
            class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition">
            決定！
        </button>

        <!-- 結果 -->
        <div class="bg-gray-50 rounded-lg p-4 text-sm text-gray-700 whitespace-pre-line" id="result"></div>

        <!-- 説明 -->
        <div class="text-sm text-gray-600 whitespace-pre-line" id="explain"></div>

        <!-- テーブル -->
        <div class="overflow-x-auto">
            <table class="table-auto border-collapse w-full text-center text-sm">
                <thead>
                    <tr id="row1" class="bg-gray-200"></tr>
                </thead>
                <tbody>
                    <tr id="row2"></tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        function calc() {
            const x = Number(document.getElementById("num1").value);
            const y = Number(document.getElementById("num2").value);

            if (x <= y) {
                alert('「大きい目数＞小さい目数」で入力してね。');
                return;
            }
            if (y <= x / 2) {
                alert('目数を半分以下にするのは対応してないよ。\nごめんね＞＜');
                return;
            }

            const poss = calcDecPos(x, y);
            const intervals = calcIntervals(poss);
            let [ptn1, ptn2, cnt1, cnt2] = calcDecPtn(intervals);

            //必ずptn1のほうが短いパターンにする。
            if (ptn1 > ptn2) {
                [ptn1, ptn2] = [ptn2, ptn1];
                [cnt1, cnt2] = [cnt2, cnt1];
            }

            const lastCnt = x - ((ptn1 * cnt1) + (ptn2 * cnt2));

            const ptn1Str = createPtnStr(ptn1, cnt1);
            const ptn2Str = createPtnStr(ptn2, cnt2);
            const lastStr = "〇".repeat(lastCnt);

            document.getElementById("result").textContent =
                "結果は\n" +
                createPtnDescStr(ptn1, cnt1, ptn1Str, 1) +
                createPtnDescStr(ptn2, cnt2, ptn2Str, 2) +
                "　最後に" + lastCnt + "目（" + lastStr + "）をやったら完成！";

            document.getElementById("explain").textContent =
                "ここからは\n" +
                createAfterPtnStr(cnt1, ptn1Str, "｜", 1) +
                createAfterPtnStr(cnt2, ptn2Str, "◇", 2) +
                "で表すよ。";

            let decPtn = []

            for (const interval of intervals) {
                decPtn.push(interval == ptn1 ? '◇' : '｜');
            }

            const row1 = document.getElementById("row1");
            const row2 = document.getElementById("row2");

            row1.innerHTML = "";
            row2.innerHTML = "";

            for (let i = 0; i < cnt1 + cnt2; i++) { //cnt1 + cnt2 と x -y は同値
                const th = document.createElement("th");
                th.textContent = decPtn[i];
                th.className = "border px-2 py-1";
                row1.appendChild(th);

                const td = document.createElement("td");
                td.className = "border px-2 py-2";

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.className = "w-5 h-5 accent-blue-500";

                td.appendChild(checkbox);
                row2.appendChild(td);
            }
        }

        /**
         * x目からy目に減目する際の減目位置を計算する
         *
         * 例:
         * 100目 → 80目
         * 戻り値: [5, 10, 14, 19, ...]
         */
        function calcDecPos(x, y) {
            //減らし目をする回数
            const decCnt = x - y;
            const poss = [];

            for (let i = 1; i <= decCnt; i++) {
                const pos = Math.round(
                    i * (x + 1) / (decCnt + 1)
                );

                poss.push(pos);
            }

            return poss;
        }

        /**
        * 減らし目同士の間隔を算出する。
        */
        function calcIntervals(poss) {
            const intervals = [];

            let prev = 0;

            for (const pos of poss) {
                intervals.push(pos - prev);
                prev = pos;
            }

            return intervals;
        }

        /**
         * 減らし目パターンの回数をカウントする。
         * 
         * 例：
         * 10目 → 7目　（○○●○○●○●○○）
         * 「３」目ごとを「２」回
         * 「２」目ごとを「１」回
        */
        function calcDecPtn(intervals) {
            let ptn1 = 0;
            let ptn2 = 0;
            let cnt1 = 0;
            let cnt2 = 0;

            for (const interval of intervals) {
                if (interval == ptn1) {
                    cnt1++;
                }
                else if (interval == ptn2) {
                    cnt2++;
                }
                else if (ptn1 == 0) {
                    ptn1 = interval;
                    cnt1++;
                }
                else if (ptn2 == 0) {
                    ptn2 = interval;
                    cnt2++;
                }
            }
            return [ptn1, ptn2, cnt1, cnt2];
        }

        /**
         * 減らし目パターン文字列作成
         * cntが0の場合は空文字列（ptn2がない場合を想定)
        */
        function createPtnStr(ptn, cnt) {
            return cnt == 0 ? "" : "〇".repeat(ptn - 1) + "●";
        }

        /**
         * 減らし目パターン説明文作成
         * cntが0の場合は空文字列（ptn2がない場合を想定)
        */
        function createPtnDescStr(ptn, cnt, ptnStr, ptnNum) {
            const space = "　".repeat(3 - ptnNum);
            return cnt == 0 ? "" : "　" + ptn + "目を" + (ptn - 1) + "目にする。（" + ptnStr + "）" + space + "：" + cnt + "回\n"
        }

        /**
         * 後半のパターン説明文作成
         * cntが0の場合は空文字列（ptn2がない場合を想定)
        */
        function createAfterPtnStr(cnt, beforeStr, afterStr, ptnNum) {
            const space = "　".repeat(2 - ptnNum);
            return cnt == 0 ? "" : "　（" + beforeStr + "）" + space + "を「" + afterStr + "」\n"
        }
    </script>

</body>

</html>
